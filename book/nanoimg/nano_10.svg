<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="300" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">AI가 보는 세상: 상태 벡터 (State Vector)</text>
  
  <!-- 자동차 주변 8칸 -->
  <g transform="translate(100, 100)">
    <rect width="150" height="150" fill="none" stroke="#ccc" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="150" stroke="#ccc"/>
    <line x1="100" y1="0" x2="100" y2="150" stroke="#ccc"/>
    <line x1="0" y1="50" x2="150" y2="50" stroke="#ccc"/>
    <line x1="0" y1="100" x2="150" y2="100" stroke="#ccc"/>
    
    <!-- 벽 표시 -->
    <rect x="50" y="0" width="50" height="50" fill="#dc3545" opacity="0.3"/> <!-- 위 -->
    <rect x="0" y="100" width="50" height="50" fill="#dc3545" opacity="0.3"/> <!-- 왼아래 -->
    
    <text x="75" y="30" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">⓵=0</text>
    <text x="75" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#dc3545" font-weight="bold">⓶=1 (벽)</text>
    <text x="125" y="30" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">⓷=0</text>
    
    <text x="25" y="80" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">⓸=0</text>
    <text x="75" y="80" font-family="Arial" font-size="20" text-anchor="middle" fill="#007bff">🚗</text>
    <text x="125" y="80" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">⓹=0</text>
    
    <text x="25" y="125" font-family="Arial" font-size="10" text-anchor="middle" fill="#dc3545" font-weight="bold">⓺=1 (벽)</text>
    <text x="75" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">⓻=0</text>
    <text x="125" y="130" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">⓼=0</text>
  </g>
  
  <!-- 추가 정보 -->
  <g transform="translate(300, 100)">
    <rect width="250" height="150" rx="10" fill="#f8f9fa" stroke="#007bff" stroke-width="2"/>
    <text x="20" y="40" font-family="Arial" font-size="14" fill="#333">⓽ 현재 방향: 오른쪽(→)</text>
    <text x="20" y="80" font-family="Arial" font-size="14" fill="#333">⓾ 목적지 X 방향: +0.6</text>
    <text x="20" y="120" font-family="Arial" font-size="14" fill="#333">⑪ 목적지 Y 방향: +0.4</text>
  </g>
  
  <!-- 최종 벡터 -->
  <rect x="50" y="300" width="500" height="50" rx="5" fill="#333"/>
  <text x="300" y="332" font-family="Courier New" font-size="16" font-weight="bold" text-anchor="middle" fill="#00ff00">
    [0, 1, 0, 0, 0, 1, 0, 0, 1, +0.6, +0.4]
  </text>
  <text x="300" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">총 11개의 숫자로 이루어진 리스트(벡터)</text>
</svg>
