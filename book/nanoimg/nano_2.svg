<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f0f8ff"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">경사하강법(Gradient Descent) 시각화</text>
  
  <!-- 산 배경 (3D 느낌) -->
  <path d="M0 400 L50 250 L150 350 L250 150 L350 300 L500 100 L600 400 Z" fill="#8b7355" stroke="#4b3621" stroke-width="2"/>
  <path d="M50 250 L100 200 L150 350 Z" fill="#a08060" opacity="0.6"/>
  <path d="M250 150 L300 100 L350 300 Z" fill="#a08060" opacity="0.6"/>
  
  <!-- 로컬 미니마 -->
  <circle cx="150" cy="350" r="10" fill="#dc3545" opacity="0.8"/>
  <text x="150" y="375" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#dc3545">로컬 미니마(가짜 골짜기)</text>
  
  <!-- 글로벌 미니마 -->
  <circle cx="350" cy="300" r="15" fill="#28a745" opacity="0.8"/>
  <text x="350" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#28a745">글로벌 미니마(진짜 최저점)</text>
  
  <!-- 사람 (추상적) -->
  <g id="person" transform="translate(450, 130)">
    <circle cx="0" cy="0" r="8" fill="#333"/>
    <line x1="0" y1="8" x2="0" y2="25" stroke="#333" stroke-width="4"/>
    <line x1="0" y1="15" x2="-10" y2="25" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="15" x2="10" y2="25" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="25" x2="-5" y2="40" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="25" x2="5" y2="40" stroke="#333" stroke-width="2"/>
    <text x="0" y="-15" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">AI (학습 중)</text>
  </g>
  
  <!-- 경사 느끼는 화살표 -->
  <path d="M430 180 L400 220" stroke="#007bff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="440" y="210" font-family="Arial" font-size="10" fill="#007bff">"낮은 곳으로 가자!"</text>
  
  <!-- 안개 -->
  <ellipse cx="450" cy="150" rx="80" ry="50" fill="white" opacity="0.4"/>
  <text x="500" y="100" font-family="Arial" font-size="12" font-style="italic" fill="#666">안개 자욱 (데이터 부족)</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff"/>
    </marker>
  </defs>
</svg>
