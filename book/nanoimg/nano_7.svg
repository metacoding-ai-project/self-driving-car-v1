<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fdfdfe"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">RNN과 LSTM의 차이 (자율주행 비유)</text>
  
  <!-- RNN (기억이 흐려짐) -->
  <g id="rnn_group" transform="translate(50, 80)">
    <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#007bff">1. RNN (순환 신경망)</text>
    <rect x="0" y="10" width="500" height="120" rx="10" ry="10" fill="#e7f3ff" stroke="#007bff" stroke-width="1" stroke-dasharray="5,5"/>
    
    <g id="car_rnn" transform="translate(30, 70)">
      <rect x="0" y="0" width="40" height="20" rx="5" ry="5" fill="#007bff"/>
      <text x="20" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">🚗</text>
      <text x="0" y="40" font-family="Arial" font-size="10" fill="#333">t=1 (기억 시작)</text>
    </g>
    
    <path d="M70 80 L140 80" stroke="#007bff" stroke-width="3" marker-end="url(#blue-head)"/>
    <text x="105" y="70" font-family="Arial" font-size="10" text-anchor="middle" fill="#007bff">기억 전달</text>
    
    <g id="car_rnn2" transform="translate(150, 70)">
      <rect x="0" y="0" width="40" height="20" rx="5" ry="5" fill="#007bff" opacity="0.6"/>
      <text x="20" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">🚗</text>
      <text x="0" y="40" font-family="Arial" font-size="10" fill="#666">t=5 (점점 흐릿)</text>
    </g>
    
    <path d="M190 80 L260 80" stroke="#007bff" stroke-width="2" opacity="0.4" marker-end="url(#blue-head-light)"/>
    
    <g id="car_rnn3" transform="translate(270, 70)">
      <rect x="0" y="0" width="40" height="20" rx="5" ry="5" fill="#007bff" opacity="0.2"/>
      <text x="20" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">🚗</text>
      <text x="0" y="40" font-family="Arial" font-size="10" fill="#999">t=10 (까먹음!)</text>
    </g>
    
    <text x="400" y="70" font-family="Arial" font-size="12" font-style="italic" fill="#dc3545">"아까 갈림길이 어디였더라...?"</text>
  </g>
  
  <!-- LSTM (중요 기억 보존) -->
  <g id="lstm_group" transform="translate(50, 250)">
    <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#28a745">2. LSTM (장단기 기억)</text>
    <rect x="0" y="10" width="500" height="150" rx="10" ry="10" fill="#e8f5e9" stroke="#28a745" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- 기억 컨베이어 벨트 -->
    <line x1="20" y1="40" x2="480" y2="40" stroke="#28a745" stroke-width="4" stroke-dasharray="10,5"/>
    <text x="250" y="30" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#28a745">Cell State (장기 기억 통로)</text>
    
    <g id="car_lstm" transform="translate(30, 100)">
      <rect x="0" y="0" width="40" height="20" rx="5" ry="5" fill="#28a745"/>
      <text x="20" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">🚗</text>
      <path d="M20 100 L20 45" stroke="#28a745" stroke-width="2" marker-start="url(#dot)"/>
      <text x="30" y="70" font-family="Arial" font-size="10" fill="#28a745">중요! 갈림길 저장 ★</text>
    </g>
    
    <g id="car_lstm2" transform="translate(150, 100)">
      <rect x="0" y="0" width="40" height="20" rx="5" ry="5" fill="#28a745"/>
      <text x="20" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">🚗</text>
      <path d="M20 100 L20 45" stroke="#666" stroke-width="2" marker-start="url(#dot-grey)"/>
      <text x="30" y="70" font-family="Arial" font-size="10" fill="#666">빈 통로 (삭제)</text>
    </g>
    
    <g id="car_lstm3" transform="translate(270, 100)">
      <rect x="0" y="0" width="40" height="20" rx="5" ry="5" fill="#28a745"/>
      <text x="20" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">🚗</text>
      <path d="M20 45 L20 100" stroke="#28a745" stroke-width="2" marker-end="url(#green-head)"/>
      <text x="30" y="70" font-family="Arial" font-size="10" font-weight="bold" fill="#28a745">기억 불러오기!</text>
    </g>
    
    <text x="400" y="100" font-family="Arial" font-size="12" font-weight="bold" fill="#28a745">"t=1 갈림길로 돌아가자!"</text>
  </g>
  
  <defs>
    <marker id="blue-head" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff"/>
    </marker>
    <marker id="blue-head-light" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff" opacity="0.4"/>
    </marker>
    <marker id="green-head" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="dot" markerWidth="4" markerHeight="4" refX="2" refY="2">
      <circle cx="2" cy="2" r="2" fill="#28a745"/>
    </marker>
    <marker id="dot-grey" markerWidth="4" markerHeight="4" refX="2" refY="2">
      <circle cx="2" cy="2" r="2" fill="#666"/>
    </marker>
  </defs>
</svg>
