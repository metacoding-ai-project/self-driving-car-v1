<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">자율주행 시뮬레이터 화면 구조</text>
  
  <rect x="50" y="50" width="500" height="300" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <!-- 격자 무늬 -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="50" y="50" width="500" height="300" fill="url(#grid)"/>
  
  <!-- 벽 -->
  <rect x="150" y="100" width="100" height="20" fill="#dc3545"/>
  <rect x="350" y="100" width="60" height="20" fill="#dc3545"/>
  <rect x="250" y="200" width="120" height="20" fill="#dc3545"/>
  <rect x="400" y="250" width="40" height="20" fill="#dc3545"/>
  
  <!-- 시작점 -->
  <circle cx="80" cy="80" r="10" fill="#ffc107"/>
  <text x="80" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffc107">시작점</text>
  
  <!-- 목적지 -->
  <rect x="450" y="300" width="30" height="30" fill="#28a745"/>
  <text x="465" y="345" font-family="Arial" font-size="10" text-anchor="middle" fill="#28a745">목적지</text>
  
  <!-- 자동차 -->
  <g transform="translate(200, 150)">
    <rect x="-15" y="-10" width="30" height="20" rx="5" fill="#007bff"/>
    <circle cx="-10" cy="10" r="4" fill="#333"/>
    <circle cx="10" cy="10" r="4" fill="#333"/>
    <text x="0" y="5" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">🚗</text>
  </g>
  
  <!-- 하단 정보창 -->
  <rect x="50" y="350" width="500" height="30" fill="#343a40"/>
  <text x="300" y="370" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">Episode: 0 | Score: 0.0 | ε: 1.00</text>
</svg>
