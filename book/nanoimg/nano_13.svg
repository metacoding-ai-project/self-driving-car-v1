<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="300" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">훈련셋(Training) vs 테스트셋(Test)</text>
  
  <rect x="50" y="80" width="500" height="100" rx="10" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  
  <!-- 훈련셋 -->
  <rect x="50" y="80" width="400" height="100" rx="10" fill="#e1f5fe" stroke="#01579b" stroke-width="2"/>
  <text x="250" y="135" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#01579b">훈련셋 (Training Set) - 80%</text>
  <text x="250" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">"이걸로 공부하세요 (연습 문제집)"</text>
  
  <!-- 테스트셋 -->
  <rect x="450" y="80" width="100" height="100" rx="10" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="500" y="135" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">테스트셋 - 20%</text>
  <text x="500" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">"시험 (처음 보는 문제)"</text>
  
  <path d="M 250 180 L 250 230" stroke="#01579b" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 500 180 L 500 230" stroke="#c62828" stroke-width="3" marker-end="url(#arrow-red)"/>
  
  <text x="250" y="260" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579b">AI 학습</text>
  <text x="500" y="260" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">최종 실력 검증</text>
  
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#01579b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
  </defs>
</svg>
