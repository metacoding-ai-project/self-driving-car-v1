<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Learning Rate (학습률/보폭) 비교</text>
  
  <!-- 보폭이 너무 클 때 -->
  <g id="too_large" transform="translate(0, 50)">
    <text x="300" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">1. 보폭이 너무 클 때 (Learning Rate: 0.1)</text>
    <path d="M50 150 Q150 20 250 150 T450 150" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="100" cy="80" r="10" fill="#dc3545" opacity="0.8"/>
    <!-- 경로 -->
    <path d="M110 80 L350 80 L200 130 L400 130" fill="none" stroke="#dc3545" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
    <text x="300" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#dc3545">지나쳐서 반대편 산으로 올라감!</text>
  </g>
  
  <!-- 보폭이 너무 작을 때 -->
  <g id="too_small" transform="translate(0, 230)">
    <text x="300" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffc107">2. 보폭이 너무 작을 때 (Learning Rate: 0.00001)</text>
    <path d="M50 150 Q100 80 150 150 T250 150 T350 150 T450 150" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="80" cy="110" r="10" fill="#ffc107" opacity="0.8"/>
    <!-- 경로 -->
    <path d="M90 115 L100 125 L110 135 L120 145" fill="none" stroke="#ffc107" stroke-width="3" marker-end="url(#arrowhead-yellow)"/>
    <text x="300" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">가짜 골짜기(로컬 미니마)에 갇힘!</text>
  </g>
  
  <!-- 딱 맞는 보폭 -->
  <g id="just_right" transform="translate(0, 410)">
    <text x="300" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">3. 딱 맞는 보폭 (Learning Rate: 0.001)</text>
    <path d="M50 150 Q150 20 300 150 T550 150" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="80" cy="100" r="10" fill="#28a745" opacity="0.8"/>
    <!-- 경로 -->
    <path d="M95 110 L150 140 L220 150 L280 150 L300 145" fill="none" stroke="#28a745" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    <text x="300" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#28a745">진짜 최저점(글로벌 미니마)에 도달!</text>
  </g>
  
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="arrowhead-yellow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffc107"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
