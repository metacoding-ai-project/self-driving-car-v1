<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">의사결정 트리(Decision Tree) 시각화</text>
  
  <!-- 루트 노드 -->
  <g id="root" transform="translate(300, 80)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" ry="10" fill="#e9ecef" stroke="#333" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">앞에 벽이 있나?</text>
    
    <!-- 가지 (Yes) -->
    <line x1="-40" y1="30" x2="-100" y2="100" stroke="#333" stroke-width="2"/>
    <text x="-90" y="70" font-family="Arial" font-size="12" fill="#dc3545">Yes</text>
    
    <!-- 가지 (No) -->
    <line x1="40" y1="30" x2="100" y2="100" stroke="#333" stroke-width="2"/>
    <text x="90" y="70" font-family="Arial" font-size="12" fill="#28a745">No</text>
  </g>
  
  <!-- 자식 노드 1 (Yes -> 목적지 확인) -->
  <g id="node1" transform="translate(200, 180)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" ry="10" fill="#e9ecef" stroke="#333" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">목적지가 오른쪽인가?</text>
    
    <!-- 가지 (Yes) -->
    <line x1="-30" y1="30" x2="-60" y2="100" stroke="#333" stroke-width="2"/>
    <text x="-65" y="70" font-family="Arial" font-size="12" fill="#dc3545">Yes</text>
    
    <!-- 가지 (No) -->
    <line x1="30" y1="30" x2="60" y2="100" stroke="#333" stroke-width="2"/>
    <text x="65" y="70" font-family="Arial" font-size="12" fill="#28a745">No</text>
  </g>
  
  <!-- 리프 노드 (최종 결정) -->
  <!-- No -> 직진 -->
  <g id="leaf_straight" transform="translate(400, 180)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" ry="20" fill="#28a745" stroke="#1e7e34" stroke-width="3"/>
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">직진!</text>
  </g>
  
  <!-- Yes -> 우회전 -->
  <g id="leaf_right" transform="translate(140, 280)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" ry="20" fill="#28a745" stroke="#1e7e34" stroke-width="3"/>
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">우회전!</text>
  </g>
  
  <!-- No -> 좌회전 -->
  <g id="leaf_left" transform="translate(260, 280)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" ry="20" fill="#28a745" stroke="#1e7e34" stroke-width="3"/>
    <text x="0" y="5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">좌회전!</text>
  </g>
  
  <text x="300" y="450" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#666">깔끔하고 명확한 질문으로 판단하는 트리</text>
</svg>
