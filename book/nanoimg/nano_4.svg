<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f9f9f9"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">역전파(Backpropagation) 시각화</text>
  
  <!-- 축구 경기장 배경 (추상적) -->
  <rect x="50" y="100" width="500" height="200" fill="#28a745" opacity="0.1"/>
  <line x1="300" y1="100" x2="300" y2="300" stroke="#fff" stroke-width="2"/>
  
  <!-- 신경망 + 축구 비유 -->
  <g id="input_layer" transform="translate(100, 200)">
    <circle cx="0" cy="0" r="30" fill="#007bff" opacity="0.6"/>
    <text x="0" y="5" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">입력층</text>
    <text x="0" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">위치 선정 실패</text>
    <path d="M-10 70 L-30 90" stroke="#dc3545" stroke-width="2" marker-end="url(#redhead)"/>
    <text x="-40" y="105" font-family="Arial" font-size="10" fill="#dc3545">가중치 수정!</text>
  </g>
  
  <g id="hidden_layer" transform="translate(300, 200)">
    <circle cx="0" cy="0" r="35" fill="#6f42c1" opacity="0.6"/>
    <text x="0" y="5" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">은닉층</text>
    <text x="0" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">패스 부정확</text>
    <path d="M-10 75 L-30 95" stroke="#dc3545" stroke-width="2" marker-end="url(#redhead)"/>
    <text x="-40" y="110" font-family="Arial" font-size="10" fill="#dc3545">가중치 수정!</text>
  </g>
  
  <g id="output_layer" transform="translate(500, 200)">
    <circle cx="0" cy="0" r="30" fill="#28a745" opacity="0.6"/>
    <text x="0" y="5" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">출력층</text>
    <text x="0" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">슈팅 빗나감</text>
    <text x="0" y="70" font-family="Arial" font-size="12" font-weight="bold" fill="#dc3545">오차 발생!</text>
  </g>

  <!-- 순전파 (Forward Pass) -->
  <path d="M140 200 L260 200" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#blackhead)"/>
  <path d="M340 200 L460 200" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#blackhead)"/>
  
  <!-- 역전파 (Backward Pass) -->
  <path d="M460 220 L340 220" stroke="#dc3545" stroke-width="3" marker-end="url(#redhead)"/>
  <path d="M260 220 L140 220" stroke="#dc3545" stroke-width="3" marker-end="url(#redhead)"/>
  <text x="300" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">오차를 거꾸로 전달하며 수정!</text>
  
  <defs>
    <marker id="blackhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="redhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
</svg>
