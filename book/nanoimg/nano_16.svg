<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="300" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">정규화(Normalization)가 필요한 이유</text>
  
  <!-- 수학 vs 영어 -->
  <g transform="translate(50, 80)">
    <rect width="240" height="180" rx="10" fill="#fff" stroke="#dc3545" stroke-width="2"/>
    <text x="120" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc3545">❌ 정규화 안 함 (착각)</text>
    <text x="30" y="70" font-family="Arial" font-size="14">수학: 80점 (100점 만점)</text>
    <text x="30" y="100" font-family="Arial" font-size="14">영어: 9점 (10점 만점)</text>
    <rect x="30" y="120" width="180" height="20" fill="#dc3545"/>
    <rect x="30" y="120" width="144" height="20" fill="#007bff"/> <!-- 80% -->
    <rect x="30" y="150" width="180" height="20" fill="#dc3545"/>
    <rect x="30" y="150" width="162" height="20" fill="#28a745"/> <!-- 90% but scale is 10 -->
    <text x="120" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#dc3545">"80이 9보다 훨씬 크네!"</text>
  </g>
  
  <g transform="translate(310, 80)">
    <rect width="240" height="180" rx="10" fill="#fff" stroke="#28a745" stroke-width="2"/>
    <text x="120" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#28a745">✅ 정규화 함 (공정)</text>
    <text x="30" y="70" font-family="Arial" font-size="14">수학: 0.8 (0~1 범위)</text>
    <text x="30" y="100" font-family="Arial" font-size="14">영어: 0.9 (0~1 범위)</text>
    <rect x="30" y="120" width="180" height="20" fill="#eee"/>
    <rect x="30" y="120" width="144" height="20" fill="#007bff"/>
    <rect x="30" y="150" width="180" height="20" fill="#eee"/>
    <rect x="30" y="150" width="162" height="20" fill="#28a745"/>
    <text x="120" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#28a745">"영어가 더 중요할 수도 있겠네!"</text>
  </g>
</svg>
