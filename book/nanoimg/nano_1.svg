<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">신경망(Neural Network) 구조</text>
  
  <!-- 입력층 -->
  <g id="input_layer">
    <text x="50" y="80" font-family="Arial" font-size="14" font-weight="bold" fill="#007bff">입력층 (11개 노드)</text>
    <circle cx="80" cy="120" r="10" fill="#007bff" opacity="0.6"/>
    <circle cx="80" cy="150" r="10" fill="#007bff" opacity="0.6"/>
    <circle cx="80" cy="180" r="10" fill="#007bff" opacity="0.6"/>
    <text x="80" y="210" font-family="Arial" font-size="20" text-anchor="middle" fill="#007bff">...</text>
    <circle cx="80" cy="240" r="10" fill="#007bff" opacity="0.6"/>
    <circle cx="80" cy="270" r="10" fill="#007bff" opacity="0.6"/>
    <circle cx="80" cy="300" r="10" fill="#007bff" opacity="0.6"/>
    <text x="80" y="330" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">주변 벽 정보, 방향 등</text>
  </g>

  <!-- 은닉층 -->
  <g id="hidden_layer">
    <text x="300" y="80" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#6f42c1">은닉층 (64개 뉴런)</text>
    <circle cx="300" cy="210" r="60" fill="#6f42c1" opacity="0.2" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="300" y="215" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#6f42c1">64 Neurons</text>
  </g>

  <!-- 출력층 -->
  <g id="output_layer">
    <text x="520" y="80" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">출력층 (3개 노드)</text>
    <circle cx="520" cy="150" r="15" fill="#28a745" stroke="#1e7e34" stroke-width="3"/>
    <text x="545" y="155" font-family="Arial" font-size="12" fill="#333">직진 (Q=8.5)</text>
    
    <circle cx="520" cy="210" r="15" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
    <text x="545" y="215" font-family="Arial" font-size="12" fill="#666">우회전 (Q=3.2)</text>
    
    <circle cx="520" cy="270" r="15" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
    <text x="545" y="275" font-family="Arial" font-size="12" fill="#666">좌회전 (Q=2.1)</text>
  </g>

  <!-- 연결선 (일부만 표시) -->
  <line x1="90" y1="120" x2="240" y2="180" stroke="#ccc" stroke-width="1" opacity="0.5"/>
  <line x1="90" y1="300" x2="240" y2="240" stroke="#ccc" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="210" x2="505" y2="150" stroke="#28a745" stroke-width="2" opacity="0.8"/>
  <line x1="360" y1="210" x2="505" y2="210" stroke="#ccc" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="210" x2="505" y2="270" stroke="#ccc" stroke-width="1" opacity="0.5"/>

  <text x="520" y="350" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#28a745">가장 높은 Q값 선택!</text>
</svg>
