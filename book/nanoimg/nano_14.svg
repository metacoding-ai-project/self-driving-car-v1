<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fcfcfc"/>
  <text x="300" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">성능 개선 로드맵 (73% → 90%+)</text>
  
  <g transform="translate(100, 80)">
    <!-- 현재 -->
    <rect width="150" height="40" rx="5" fill="#e9ecef" stroke="#333"/>
    <text x="75" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">현재 v5: 73%</text>
    
    <!-- 화살표 및 단계 -->
    <path d="M 75 40 L 75 400" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
    
    <g transform="translate(0, 60)">
      <circle cx="75" cy="0" r="10" fill="#007bff"/>
      <rect x="100" y="-20" width="300" height="40" rx="5" fill="#fff" stroke="#007bff"/>
      <text x="110" y="5" font-family="Arial" font-size="12" fill="#333">① Double DQN: 판단/평가 분리 (+3~5%)</text>
    </g>
    
    <g transform="translate(0, 120)">
      <circle cx="75" cy="0" r="10" fill="#007bff"/>
      <rect x="100" y="-20" width="300" height="40" rx="5" fill="#fff" stroke="#007bff"/>
      <text x="110" y="5" font-family="Arial" font-size="12" fill="#333">② Prioritized Replay: 중요 경험 복습 (+5~8%)</text>
    </g>
    
    <g transform="translate(0, 180)">
      <circle cx="75" cy="0" r="10" fill="#007bff"/>
      <rect x="100" y="-20" width="300" height="40" rx="5" fill="#fff" stroke="#007bff"/>
      <text x="110" y="5" font-family="Arial" font-size="12" fill="#333">③ Dueling Network: 상태 가치 분리 (+4~7%)</text>
    </g>
    
    <g transform="translate(0, 240)">
      <circle cx="75" cy="0" r="10" fill="#007bff"/>
      <rect x="100" y="-20" width="300" height="40" rx="5" fill="#fff" stroke="#007bff"/>
      <text x="110" y="5" font-family="Arial" font-size="12" fill="#333">④ 맵 다양성 증가: 100개 이상의 맵 (+2~4%)</text>
    </g>
    
    <g transform="translate(0, 300)">
      <circle cx="75" cy="0" r="10" fill="#007bff"/>
      <rect x="100" y="-20" width="300" height="40" rx="5" fill="#fff" stroke="#007bff"/>
      <text x="110" y="5" font-family="Arial" font-size="12" fill="#333">⑤ 입력 정보 확장: 시야 확장 (+2~3%)</text>
    </g>
    
    <!-- 목표 -->
    <g transform="translate(0, 380)">
      <rect x="0" y="-20" width="400" height="50" rx="10" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3"/>
      <text x="200" y="15" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">목표: 90% 이상 달성 가능!</text>
    </g>
  </g>
</svg>
