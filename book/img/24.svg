<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">랜덤 포레스트(Random Forest) 앙상블 투표</text>
  
  <!-- 100개 트리 표현 (대표적으로 3개) -->
  <g id="trees" transform="translate(50, 100)">
    <g id="tree1" transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="120" rx="5" ry="5" fill="#e1f5fe" stroke="#007bff" stroke-width="2"/>
      <text x="40" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#007bff">트리 1호</text>
      <text x="40" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">"직진!"</text>
      <path d="M40 120 L150 200" stroke="#007bff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    </g>
    
    <g id="tree2" transform="translate(100, 0)">
      <rect x="0" y="0" width="80" height="120" rx="5" ry="5" fill="#e1f5fe" stroke="#007bff" stroke-width="2"/>
      <text x="40" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#007bff">트리 2호</text>
      <text x="40" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">"우회전"</text>
      <path d="M40 120 L50 200" stroke="#007bff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    </g>
    
    <text x="210" y="70" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">...</text>
    
    <g id="tree100" transform="translate(240, 0)">
      <rect x="0" y="0" width="80" height="120" rx="5" ry="5" fill="#e1f5fe" stroke="#007bff" stroke-width="2"/>
      <text x="40" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#007bff">트리 100호</text>
      <text x="40" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">"직진!"</text>
      <path d="M40 120 L-100 200" stroke="#007bff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    </g>
  </g>
  
  <!-- 투표함 -->
  <g id="voting" transform="translate(300, 320)">
    <rect x="-100" y="-40" width="200" height="80" rx="10" ry="10" fill="#fff3cd" stroke="#ffc107" stroke-width="3"/>
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#856404">투표함</text>
    <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#856404">(Voting)</text>
    
    <path d="M100 0 L150 0" stroke="#28a745" stroke-width="4" marker-end="url(#arrow-green)"/>
  </g>
  
  <!-- 최종 결정 -->
  <g id="final_result" transform="translate(500, 320)">
    <circle cx="0" cy="0" r="50" fill="#28a745" stroke="#1e7e34" stroke-width="3"/>
    <text x="0" y="5" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">직진!</text>
    <text x="0" y="25" font-family="Arial" font-size="10" text-anchor="middle" fill="#fff">다수결의 힘</text>
  </g>
  
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
