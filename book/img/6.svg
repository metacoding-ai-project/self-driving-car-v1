<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fdfdfd"/>
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">정규화(Normalization): 숫자의 만점 통일</text>
  
  <!-- Raw Data Case -->
  <rect x="50" y="80" width="240" height="250" rx="15" fill="#fff5f5" stroke="#ffcccc" stroke-width="2"/>
  <text x="170" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#c00">정규화 전 (Raw)</text>
  <text x="70" y="150" font-family="Arial, sans-serif" font-size="14" fill="#555">수학 (100점 만점):</text>
  <rect x="70" y="160" width="180" height="20" fill="#ddd"/>
  <rect x="70" y="160" width="180" height="20" fill="#ff7675"/>
  <text x="255" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">100점</text>
  
  <text x="70" y="210" font-family="Arial, sans-serif" font-size="14" fill="#555">영어 (10점 만점):</text>
  <rect x="70" y="220" width="180" height="20" fill="#ddd"/>
  <rect x="70" y="220" width="144" height="20" fill="#74b9ff"/>
  <text x="220" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">8점</text>
  
  <text x="170" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d63031" font-weight="bold">"수학이 훨씬 중요하네!"</text>
  <text x="170" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">(AI가 숫자의 크기로 중요도를 착각함)</text>

  <!-- Normalized Data Case -->
  <rect x="310" y="80" width="240" height="250" rx="15" fill="#f0fff4" stroke="#c6f6d5" stroke-width="2"/>
  <text x="430" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2d6a4f">정규화 후 (0~1 범위)</text>
  <text x="330" y="150" font-family="Arial, sans-serif" font-size="14" fill="#555">수학 (정규화):</text>
  <rect x="330" y="160" width="180" height="20" fill="#ddd"/>
  <rect x="330" y="160" width="180" height="20" fill="#ff7675"/>
  <text x="515" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">1.0</text>
  
  <text x="330" y="210" font-family="Arial, sans-serif" font-size="14" fill="#555">영어 (정규화):</text>
  <rect x="330" y="220" width="180" height="20" fill="#ddd"/>
  <rect x="330" y="220" width="144" height="20" fill="#74b9ff"/>
  <text x="480" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">0.8</text>
  
  <text x="430" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0984e3" font-weight="bold">"둘 다 비슷한 비중이군!"</text>
  <text x="430" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">(AI가 공정하게 두 과목을 판단함)</text>

  <text x="300" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#d63031">※ 숫자 크기가 다르면 AI가 착각합니다!</text>
</svg>