<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">DQN 신경망 구조와 Q값</text>
  
  <!-- Labels -->
  <text x="100" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">입력층 (11개 노드)</text>
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">은닉층 (64개 뉴런)</text>
  <text x="500" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">출력층 (Q값 3개)</text>

  <!-- Input Nodes -->
  <circle cx="100" cy="100" r="8" fill="#74b9ff" stroke="#0984e3" stroke-width="2"/>
  <circle cx="100" cy="130" r="8" fill="#74b9ff" stroke="#0984e3" stroke-width="2"/>
  <circle cx="100" cy="160" r="8" fill="#74b9ff" stroke="#0984e3" stroke-width="2"/>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#555">⋮</text>
  <circle cx="100" cy="240" r="8" fill="#74b9ff" stroke="#0984e3" stroke-width="2"/>

  <!-- Connections -->
  <line x1="108" y1="130" x2="245" y2="170" stroke="#ddd" stroke-width="1"/>
  <line x1="108" y1="160" x2="245" y2="170" stroke="#ddd" stroke-width="1"/>
  <line x1="108" y1="240" x2="245" y2="170" stroke="#ddd" stroke-width="1"/>

  <!-- Hidden Block -->
  <rect x="250" y="80" width="100" height="250" rx="10" fill="#fab1a0" stroke="#e17055" stroke-width="2" opacity="0.8"/>
  <text x="300" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d63031">신경망 계산</text>
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(64 Neurons)</text>

  <!-- Output Layer -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="#55efc4" stroke="#00b894" stroke-width="2"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">직진</text>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">Q = 8.5</text>
    <text x="-30" y="30" font-family="Arial, sans-serif" font-size="24" fill="#ff7675" font-weight="bold">★</text>
  </g>

  <g transform="translate(450, 180)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">우회전</text>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Q = 3.2</text>
  </g>

  <g transform="translate(450, 260)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">좌회전</text>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Q = 2.1</text>
  </g>

  <text x="300" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e17055">가장 높은 Q값을 가진 행동을 선택합니다!</text>
</svg>